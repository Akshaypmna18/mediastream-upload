name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted Publishing needs a recent npm CLI (OIDC)
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Pack sanity check
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt
          if grep -E 'node_modules|\.vite/' /tmp/npm-pack.txt; then
            echo "::error::tarball includes node_modules or Vite cache — fix .npmignore"
            exit 1
          fi

      - run: npm publish --access public
